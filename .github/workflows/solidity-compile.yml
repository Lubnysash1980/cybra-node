name: Solidity source compile

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**/*.sol"
      - "test/**/*.sol"
      - "lib/forge-std"
      - "modules/module_*/contracts/**/*.sol"
      - ".github/workflows/solidity-compile.yml"
      - "foundry.toml"
      - "modules/module_*/**/*.py"
      - "modules/module_*/**/*.sh"
      - "modules/module_19_contract_tui_menu/bin/cybra_menu.sh"
      - "catalog/contracts.json"
      - "evolution_dashboard/**/*.py"
      - "evolution_dashboard/*.sh"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile all production Solidity sources (Foundry settings)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              list(Path("src").glob("*.sol")) +
              list(Path("modules").glob("module_*/contracts/*.sol"))
          )
          if not files:
              raise SystemExit("No production Solidity sources found")

          sources = {p.as_posix(): {"content": p.read_text()} for p in files}
          settings = {
              "optimizer": {"enabled": True, "runs": 200},
              "viaIR": True,
              "evmVersion": "shanghai",
              "outputSelection": {"*": {"*": ["abi", "evm.bytecode.object"]}}
          }
          Path("/tmp/cybra-solc-input.json").write_text(
              json.dumps({"language": "Solidity", "sources": sources, "settings": settings})
          )
          print(f"Found {len(files)} production Solidity source files")
          PY
          npx --yes solc@0.8.24 --standard-json < /tmp/cybra-solc-input.json > /tmp/cybra-solc-output.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path("/tmp/cybra-solc-output.json").read_text()
          start = raw.find("{")
          if start < 0:
              print(raw)
              raise SystemExit("solc returned no JSON output")
          result = json.loads(raw[start:])
          errors = result.get("errors", [])
          for item in errors:
              if item.get("severity") == "error":
                  print(item.get("formattedMessage", item.get("message", "Compiler error")))
          failures = [e for e in errors if e.get("severity") == "error"]
          if failures:
              raise SystemExit(f"Solidity compilation failed: {len(failures)} error(s)")
          contracts = sum(len(v) for v in result.get("contracts", {}).values())
          print(f"SOLIDITY_COMPILE_OK contracts={contracts} viaIR=true optimizer=200")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Restore pinned forge-std dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib/forge-std
          mkdir -p lib
          git clone --filter=blob:none https://github.com/foundry-rs/forge-std.git lib/forge-std
          git -C lib/forge-std checkout ba4733c33497dd0c0983dcc033d7645576cc46e5
      - name: Run Foundry tests
        run: forge test -vv

  automation-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Python syntax checks
        run: |
          python3 -m compileall -q \
            modules/module_402_menu_doctor \
            modules/module_405_task_engine \
            modules/module_408_menu_tester \
            modules/module_500_neuro \
            evolution_dashboard/server.py
      - name: Bash syntax checks
        run: |
          bash -n modules/module_19_contract_tui_menu/bin/cybra_menu.sh
          bash -n modules/module_402_menu_doctor/main.sh
          bash -n modules/module_405_task_engine/main.sh
          bash -n modules/module_405_task_engine/cron.sh
          bash -n modules/module_408_menu_tester/main.sh
          bash -n modules/module_500_neuro/main.sh
          bash -n evolution_dashboard/cybra-evolution.sh
          bash -n evolution_dashboard/main.sh
          bash -n evolution_dashboard/run-tests.sh
      - name: Run NEURO and menu tester unit tests
        run: |
          python3 -m unittest discover -s modules/module_500_neuro -p 'test_*.py' -v
          python3 -m unittest discover -s modules/module_405_task_engine -p 'test_*.py' -v
          python3 -m unittest discover -s modules/module_408_menu_tester -p 'test_*.py' -v
          bash evolution_dashboard/run-tests.sh
